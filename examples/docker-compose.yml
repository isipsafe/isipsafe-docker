services:
  isipsafe-blocklist:
    image: isipsafe/isipsafe:latest
    command: sync-blocklist
    restart: unless-stopped
    environment:
      ISIPSAFE_API_KEY: ${ISIPSAFE_API_KEY:?set ISIPSAFE_API_KEY in .env}
      BLOCKLIST_FORMAT: nginx
      BLOCKLIST_OUTPUT: /data/isipsafe-blocklist.conf
      BLOCKLIST_CONFIDENCE_MINIMUM: 90
      BLOCKLIST_INTERVAL: 1800
    volumes:
      - blocklist:/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - blocklist:/etc/nginx/isipsafe:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  blocklist:
